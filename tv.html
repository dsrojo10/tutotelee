<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Pantalla de TV accesible de TutoTeLee." />
    <title>TutoTeLee · TV</title>
    <script type="module" src="/src/tv.js"></script>
  </head>
  <body class="tv-page">
    <main class="tv-shell">
      <p id="tv-status" class="tv-status" role="status" aria-live="polite">Iniciando TutoTeLee…</p>

      <section id="pairing-view" class="tv-view" aria-labelledby="pairing-title">
        <h1 id="pairing-title" class="tv-heading">Escribe este código en el celular</h1>
        <p id="tv-code" class="tv-code" aria-live="polite">—— ——</p>
      </section>

      <section id="text-view" class="tv-view" aria-label="Texto de la conversación" hidden>
        <p id="tv-text" class="tv-text">Esperando que hablen…</p>
        <p id="partial-label" class="partial-label" hidden>Texto provisional</p>
      </section>

      <section id="tv-error" class="tv-view tv-error" role="alert" hidden>
        <h1>No pudimos iniciar TutoTeLee</h1>
        <p id="tv-error-detail">Revisa la configuración y vuelve a cargar la página.</p>
      </section>
    </main>
  </body>
</html>
