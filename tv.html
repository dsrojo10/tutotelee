<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://apis.google.com https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ https://www.recaptcha.net/recaptcha/; connect-src 'self' ws://localhost:* ws://127.0.0.1:* https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebasedatabase.app https://*.firebaseapp.com https://www.google.com/recaptcha/ https://www.recaptcha.net/recaptcha/; frame-src https://*.firebaseapp.com https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/ https://www.recaptcha.net/recaptcha/; img-src 'self' data:; style-src 'self'; font-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; upgrade-insecure-requests"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Pantalla de TV accesible de TutoTeLee." />
    <title>TutoTeLee · TV</title>
    <script type="module" src="/src/tv.js"></script>
  </head>
  <body class="tv-page">
    <main class="tv-shell">
      <p id="tv-status" class="tv-status" role="status" aria-live="polite">Iniciando TutoTeLee…</p>

      <section id="pairing-view" class="tv-view" aria-labelledby="pairing-title">
        <h1 id="pairing-title" class="tv-heading">Escribe este código en el celular</h1>
        <p id="tv-code" class="tv-code" aria-live="polite">—— ——</p>
      </section>

      <section id="text-view" class="tv-view" aria-label="Texto de la conversación" hidden>
        <p id="tv-text" class="tv-text">Esperando que hablen…</p>
        <p id="partial-label" class="partial-label" hidden>Texto provisional</p>
      </section>

      <section id="tv-error" class="tv-view tv-error" role="alert" hidden>
        <h1>No pudimos iniciar TutoTeLee</h1>
        <p id="tv-error-detail">Revisa la configuración y vuelve a cargar la página.</p>
      </section>
    </main>
  </body>
</html>
